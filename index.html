<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成人网站导航 - 前后端分离版</title>
<style>
    body {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.6;
        background: #f8f9fa;
    }
    h1 { text-align: center; margin-bottom: 8px; color: #333; }
    .table-wrapper {
        width: 100%;
        overflow-x: auto;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        background: white;
    }
    table { width: 100%; border-collapse: collapse; min-width: 1100px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f1f3f5; cursor: pointer; user-select: none; }
    th:hover { background: #e2e6ea; }
    th:focus-visible { outline: 2px solid #0066cc; outline-offset: -2px; }
    tr:hover { background: #f8f9fa; }
    a { color: #0066cc; text-decoration: none; }
    .visits { font-weight: bold; color: #d32f2f; }
    th.sorted-asc::after { content: " ▲"; color: #0066cc; }
    th.sorted-desc::after { content: " ▼"; color: #0066cc; }

    @media (max-width: 768px) {
        table { min-width: 0; }
        table, thead, tbody, th, td, tr { display: block; width: 100%; }
        thead { display: none; }
        tr { margin-bottom: 16px; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        td { display: flex; padding: 12px 16px; border: none; border-bottom: 1px solid #f0f0f0; align-items: center; }
        td:before { content: attr(data-label); width: 100px; flex-shrink: 0; font-weight: bold; color: #555; }
        td:nth-child(1):before { content: "网站名称"; }
        td:nth-child(2):before { content: "访问量"; }
        td:nth-child(3):before { content: "网址"; }
        td:nth-child(4):before { content: "描述"; }
    }
</style>
</head>
<body>
    <h1>成人网站导航（前后端分离版）</h1>
    <p style="text-align:center; color:#666;" id="updateTime"></p>

    <div class="table-wrapper">
        <table id="siteTable">
            <thead>
                <tr>
                    <th onclick="sortTable(0)">网站名称</th>
                    <th onclick="sortTable(1)">访问量</th>
                    <th onclick="sortTable(2)">URL</th>
                    <th onclick="sortTable(3)">描述</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

<script>
let sitesData = [];
let currentSort = { col: 1, dir: 'desc' };

// 表头索引 → sites.json 里的字段名
const COLUMNS = ['name', 'visits', 'url', 'desc'];

// 只放行 http / https，避免 javascript: 之类的伪协议
function safeUrl(raw) {
    try {
        const u = new URL(String(raw), location.href);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
    } catch (e) {
        return null;
    }
}

function makeCell(label, text, className) {
    const td = document.createElement('td');
    td.setAttribute('data-label', label);
    if (className) { td.className = className; }
    td.textContent = text == null ? '' : text;
    return td;
}

function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    const frag = document.createDocumentFragment();

    data.forEach(function (site) {
        const tr = document.createElement('tr');

        const tdUrl = document.createElement('td');
        tdUrl.setAttribute('data-label', '网址');
        const url = safeUrl(site.url);
        if (url) {
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = site.url;
            tdUrl.appendChild(a);
        } else {
            tdUrl.textContent = site.url || '(无效链接)';
        }

        tr.appendChild(makeCell('网站名称', site.name));
        tr.appendChild(makeCell('访问量', site.visitsText, 'visits'));
        tr.appendChild(tdUrl);
        tr.appendChild(makeCell('描述', site.desc));
        frag.appendChild(tr);
    });

    tbody.innerHTML = '';
    tbody.appendChild(frag);
}

function updateArrows(colIndex, dir) {
    document.querySelectorAll('th').forEach(function (th, i) {
        th.classList.toggle('sorted-asc', i === colIndex && dir === 'asc');
        th.classList.toggle('sorted-desc', i === colIndex && dir === 'desc');
        if (i === colIndex) {
            th.setAttribute('aria-sort', dir === 'asc' ? 'ascending' : 'descending');
        } else {
            th.removeAttribute('aria-sort');
        }
    });
}

// 真正执行排序（不翻转方向，方向由调用方给）
function applySort(colIndex, dir) {
    const key = COLUMNS[colIndex];
    const numeric = key === 'visits';
    currentSort = { col: colIndex, dir: dir };

    const sorted = sitesData.slice().sort(function (a, b) {
        let cmp;
        if (numeric) {
            cmp = Number(a[key]) - Number(b[key]);
        } else {
            const va = a[key] == null ? '' : String(a[key]);
            const vb = b[key] == null ? '' : String(b[key]);
            cmp = va.localeCompare(vb, 'zh-CN');
        }
        return dir === 'desc' ? -cmp : cmp;
    });

    renderTable(sorted);
    updateArrows(colIndex, dir);
}

// 点击表头：同列切换方向，换列按该列的数据给默认方向
function sortTable(colIndex) {
    let dir;
    if (currentSort.col === colIndex) {
        dir = currentSort.dir === 'desc' ? 'asc' : 'desc';
    } else {
        dir = colIndex === 1 ? 'desc' : 'asc';
    }
    applySort(colIndex, dir);
}

function enableKeyboardSorting() {
    document.querySelectorAll('th').forEach(function (th, i) {
        th.tabIndex = 0;
        th.setAttribute('role', 'button');
        th.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                sortTable(i);
            }
        });
    });
}

async function loadData() {
    const status = document.getElementById('updateTime');
    try {
        const response = await fetch('sites.json');
        if (!response.ok) { throw new Error('HTTP ' + response.status); }
        const data = await response.json();
        sitesData = Array.isArray(data.sites) ? data.sites : [];
        status.textContent = '最后更新：' + (data.lastUpdated || '未知');
        applySort(1, 'desc');   // 首屏：访问量从高到低
    } catch (e) {
        console.error('加载 sites.json 失败：', e);
        status.textContent = '数据加载失败（' + e.message + '），请确认 sites.json 与 index.html 在同一目录，且通过网页服务器打开。';
        status.style.color = '#d32f2f';
    }
}

enableKeyboardSorting();
window.addEventListener('load', loadData);
</script>
</body>
</html>
